<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Career Copilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #151521;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background-color: #1e1e2d;
            border: 1px solid #323248;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .nav-pills .nav-link {
            color: #a2a2c3;
            border-radius: 8px;
        }
        .nav-pills .nav-link.active {
            background-color: #6c5ce7;
            color: #ffffff;
        }
        .form-control {
            background-color: #151521;
            border: 1px solid #323248;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #151521;
            border-color: #6c5ce7;
            color: #ffffff;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #6c5ce7;
            border: none;
        }
        .btn-primary:hover {
            background-color: #5b4bc4;
        }
    </style>
</head>
<body>

<div class="auth-card p-4">
    <h3 class="text-center mb-4 fw-bold text-primary">AI Career Copilot</h3>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning py-2 small" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <ul class="nav nav-pills mb-4 nav-justified" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link {{ '' if register_mode else 'active' }}" data-bs-toggle="pill" data-bs-target="#login" type="button">Login</button>
        </li>
        <li class="nav-item">
            <button class="nav-link {{ 'active' if register_mode else '' }}" data-bs-toggle="pill" data-bs-target="#register" type="button">Register</button>
        </li>
    </ul>
    
    <div class="tab-content">
        <!-- LOGIN FORM -->
        <div class="tab-pane fade {{ '' if register_mode else 'show active' }}" id="login">
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div class="tab-pane fade {{ 'show active' if register_mode else '' }}" id="register">
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Create Account</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
